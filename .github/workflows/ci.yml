name: CI

# Lint and the tests on Linux and native Windows, without the GPU group: torch and the models
# are several gigabytes, and the tests that need them skip without them. On Windows the Rust
# extension is not built either (pyproject.toml); its Python versions run instead.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
      - name: Install
        run: uv sync --no-group gpu
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Tests
        run: uv run pytest
