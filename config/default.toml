# Default settings.
#
# The web UI stores its changes in the state database. This file is the starting
# point and the "reset to defaults" target. Rules are described in docs/spec.md.

[paths]
# Empty: found on this PC (src/kitshot/fm_paths.py). To set a folder yourself, put it in
# config/local.toml, which is not in git, so the repository holds no Windows user name. A
# Windows path works on Windows and from WSL; write it in single quotes:
#   [paths]
#   fm_user_dir = 'C:\Users\<you>\Documents\Sports Interactive\Football Manager 27'
#
# FM27's user folder (saves and graphics), looked for in Windows's Documents folder
# (wherever it was moved, OneDrive included), then %OneDrive%\Documents and
# %USERPROFILE%\Documents. Not found: Kitshot says so and reads no save.
fm_user_dir = ""
# FM27's install folder, read only for its list of the photos it ships (docs/research.md
# section 4). Looked for in every Steam library, then Epic's and the Xbox app's installs. Not
# found: no pre-existing player counts as without a photo.
fm_install_dir = ""
data_dir = "data"

[eligibility]
mens_football_only = true
# The continental competitions my club plays in are found from its first team's fixtures: the
# Champions League (1301394), the Europa League (1301396) and the Conference League (31051584)
# when it plays in their current edition (docs/research.md section 24), and any other
# competition whose clubs are mostly from other nations, a few from each. This list, when not
# empty, is used instead: competition editor-database IDs (fmsave's Competition.database_id,
# stable across saves), of which the ones my club plays in count.
continental_competition_ids = []
# A player I have loaned out counts as "at my club" while I hold the contract: drawn in the
# [cutoffs.my_club] loans group, tracked, and with my club's age looks.
loaned_out_at_my_club = true

[newgen]
# Newgens are told apart by unique ID: the game gives everyone it creates an ID above the
# last one in its database. The boundary is detected per career at its first sync (the
# largest gap in IDs above 2,000,000,000) and stored. This value is used only when no clear
# gap is found. Phase 0.1 save: database IDs end near 2,001,040,995, created people start
# at 2,002,064,399.
fallback_min_unique_id = 2002000000

# Fixed rules, not settings (docs/spec.md section 2):
#   - every player at my club gets a picture, newgen or pre-existing;
#   - elsewhere only newgens, and pre-existing players without a photo ([no_photo]), are
#     picked automatically: the "candidates";
#   - other pre-existing players elsewhere are generated only when picked in the UI;
#   - group A players are tracked (their picture is re-drawn when they change club or
#     age band). Groups set picture quality; tracking is separate (spec section 2).

# How each group's pictures are drawn (Phase 16: who is in each group is [cutoffs]). The groups
# are Detailed (a), Standard (b) and Light (c) in the UI.
# published_long_edge is the height in pixels: 1024 gives 768x1024 for a 3:4 picture and
# 1024x1024 for a square ([picture]).
# detail_size: the chosen picture upscaled, re-drawn lightly and checked again. "x1.5" is 1.5
# times the render (1344x1728 for 3:4, 1536x1536 for 1:1); "smaller" needs less graphics memory
# (1152x1472, 1280x1280); "off" skips the pass. Pictures already drawn keep their size: a change
# applies to pictures drawn from then on (Phase 10).

[groups.a]
published_long_edge = 1024
candidates = 3
detail_size = "x1.5"

[groups.b]
published_long_edge = 768
candidates = 1
detail_size = "off"

[groups.c]
published_long_edge = 512
candidates = 1
detail_size = "off"

[cutoffs]
# Who is picked for each group (user, 2026-11-20 and 2026-11-21; docs/spec.md section 2). Every
# number means "at least" (155 is CA 155 or more). The candidates are the people the rules can
# pick: newgens, and pre-existing players without a photo ([no_photo]). A share "top N%" of a
# league: its candidates sorted by CA (or PA), and everyone at or above the value of the one at
# rank ceil(N% x count), ties included. "-" switches a cell off. A player takes the highest
# group any rule gives. Shares are measured again at every sync.
# mode: "auto" uses [cutoffs.share] for my league; "manual" uses [cutoffs.manual]. The other
# leagues' cells are shares in both modes; [cutoffs.everywhere] is numbers in both.
mode = "auto"
# The league above mine and the league below get Light (c) pictures by their share
# (above_c_ca, below_c_ca), each with its own switch (user, 2026-11-22).
light_above = true
light_below = false

[cutoffs.my_club]
# The group each part of my club is drawn in: "a", "b" or "c". Youth teams (reserves, under-23s,
# under-18s) and players I loaned out reach "a" by my league's or the global "a" cut. Everyone at
# my club is tracked while there; loaned-out players while I hold the contract.
first_team = "a"
youth = "b"
loans = "b"
# Newgens who came through my academy stay in "b", tracked for good, after they leave.
academy_alumni = true

[cutoffs.share]
# My league's cells in auto mode (percent, one decimal, or "-"). Detailed and Standard lowered
# from 6/3% and 40/20% (user, 2026-11-22: "around top 2.5% and top 12%").
a_ca = 2.5
a_pa = 2.5
b_ca = 12.0
b_pa = 12.0
c_ca = 80.0
c_pa = "-"
# The league above mine, the league below (each a level of my pyramid as the save's own rules
# list it; parallel divisions share a level; where the rules do not place my league there is no
# league above or below, and their cells show as off) and the continental competitions my club
# plays in.
above_b_ca = 15.0
above_c_ca = 50.0                   # only while light_above is on
below_c_ca = 50.0                   # only while light_below is on
continental_b_ca = 30.0

[cutoffs.manual]
# My league's cells in manual mode: at least this CA or PA (1-200), or "-". Switching modes on the
# Settings page converts each cell from the latest save.
a_ca = "-"
a_pa = "-"
b_ca = 131
b_pa = 151
c_ca = 116
c_pa = 141

[cutoffs.everywhere]
# At any club, whatever the league: at least this CA or PA (1-200), or "-". Raised from 155/170
# and 140/155 (user, 2026-11-22: Detailed higher, Standard slightly).
a_ca = 165
a_pa = 180
b_ca = 145
b_pa = 160
c_ca = "-"
c_pa = "-"

[staff]
# My club's staff (coaches, physios, scouts, analysts, the board, and the manager: you) get
# pictures like the players at my club: group A quality, tracked while at my club, re-drawn
# when their age wording changes. They wear club wear for their job (src/kitshot/core/wardrobe.py:
# suits, coats, training wear, lab coats) with the club's colours on one piece, not the
# playing kit, and their age wording comes from [age.staff]. Staff at other clubs are not
# read. Pin a person to "never" on their page to leave them out. Requested by the user,
# 2026-11-12 (docs/spec.md section 2). They are drawn as [style] gender says, like everyone.
enabled = true

[media]
# Journalists and press officers (user, 2026-11-13), read from the save by
# src/kitshot/datasource/people.py. They are drawn once at group B quality, as [style] gender
# says, in clothes for their work, and not tracked. Journalists from my club's country
# and my club's press officers are drawn without a request; any other journalist can be
# picked on the Players page. Pin a regular at my club to A on their page: group A quality,
# and tracked like any group A person, so re-drawn when their age wording changes.
journalists = true
press_officers = true

[no_photo]
# Pre-existing players with no photo in FM27 (a silhouette) are picked like newgens: the
# group A, B and C thresholds apply to them, though the academy rules do not (user,
# 2026-11-12). "No photo" means FM27 ships none for them and no facepack in the graphics
# folder maps them; Kitshot's own pictures do not count. Both are re-read at each sync. If
# FM27's photo list cannot be read, no one counts as without a photo.
enabled = true

[age]
# Real age (whole years) picks an age wording, W01 (youngest look) to W10 (oldest); the
# wording text is fixed in src/kitshot/core/age.py. Each table gives, per wording, the first
# real age that gets it; it applies until the next used wording's first age. "-" leaves a
# wording out of that table (Phase 12, user 2026-11-17: every table offers all ten). Ages
# below a table's first used wording use that wording. First ages must rise from W01 to W10.
# A tracked player is re-drawn when their wording changes. Chosen by the user, 2026-11-11;
# W06 back in my club's table at 26, W05 from 24 (user, 2026-11-17).
# Every table also has an auto mode (Phase 17l, user 2026-11-22): `mode = "auto"` spreads the
# looks `from` to `to` over the ages `start` to `end` (as for staff, below) instead of the
# looks; "manual" (shown as Custom) uses the looks. The players' tables stay manual with their
# looks, so the update re-draws nobody; their spreads keep each table's first and last looks.

[age.a_my_club]                     # group A at my club, the most visible players
mode = "manual"
from = "W01"
to = "W10"
start = 16
end = 34
W01 = 15                            # 15-16
W02 = 17                            # 17-18
W03 = 19                            # 19-21
W04 = 22                            # 22-23
W05 = 24                            # 24-25
W06 = 26                            # 26
W07 = 27                            # 27-28
W08 = 29                            # 29-30
W09 = 31                            # 31-33
W10 = 34                            # 34 and older

[age.a_other_club]                  # group A elsewhere
mode = "manual"
from = "W02"
to = "W10"
start = 18
end = 34
W01 = "-"
W02 = 15                            # 15-18
W03 = 19                            # 19-21
W04 = 22                            # 22-24
W05 = "-"
W06 = "-"
W07 = 25                            # 25-28
W08 = "-"
W09 = 29                            # 29-33
W10 = 34                            # 34 and older

[age.b]                             # group B
mode = "manual"
from = "W02"
to = "W09"
start = 18
end = 29
W01 = "-"
W02 = 15                            # 15-18
W03 = "-"
W04 = 19                            # 19-24
W05 = "-"
W06 = "-"
W07 = 25                            # 25-28
W08 = "-"
W09 = 29                            # 29 and older
W10 = "-"

[age.c]                             # group C
mode = "manual"
from = "W03"
to = "W08"
start = 21
end = 28
W01 = "-"
W02 = "-"
W03 = 15                            # 15-21
W04 = "-"
W05 = "-"
W06 = 22                            # 22-27
W07 = "-"
W08 = 28                            # 28 and older
W09 = "-"
W10 = "-"

[age.staff]                         # my club's staff, whatever their group (user, 2026-11-12)
# "manual": the looks below. "auto" (Phase 16f): the looks from `from` to `to` spread over the
# ages `start` to `end`: up to `start` the first look, from `end` the last, and the years between
# split evenly over the looks between, a leftover year to the younger looks. W02-W10 over 28-64:
# 28 and under, 29-33, 34-38, ..., 59-63, 64 and over. Switching to manual copies the spread.
# Auto by default (user, 2026-11-22: re-drawing my club's staff once is fine); the looks below
# are the manual table.
mode = "auto"
from = "W02"
to = "W10"
start = 28
end = 64
# Very wide bands, and never W01: most staff fall in W03-W07. Across the Telford save's
# 71,000 staff, 90% are 25-60, about 4% under 25 and 6% over 60 (docs/research.md).
W01 = "-"
W02 = 18                            # under 25
W03 = 25                            # 25-31
W04 = 32                            # 32-38
W05 = 39                            # 39-45
W06 = 46                            # 46-52
W07 = 53                            # 53-60
W08 = 61                            # 61-67
W09 = 68                            # 68-74
W10 = 75                            # 75 and older

[age.media]                         # journalists and press officers
# Auto by default (user, 2026-11-22): W04 (media looks start there, user 2026-11-14) to W10
# over 30-60: 30 and under, 31-36, 37-42, 43-48, 49-54, 55-59, 60 and over. Journalists in every
# save seen are 27-63, the middle 90% about 29-61 (docs/research.md). The looks below are the
# manual table: the staff bands from W04 up, as before.
mode = "auto"
from = "W04"
to = "W10"
start = 30
end = 60
W01 = "-"
W02 = "-"
W03 = "-"
W04 = 18                            # under 39
W05 = 39                            # 39-45
W06 = 46                            # 46-52
W07 = 53                            # 53-60
W08 = 61                            # 61-67
W09 = 68                            # 68-74
W10 = 75                            # 75 and older

[reference]
# A re-draw of a player who already has a picture (new kit, new age wording, promotion to
# A, "new picture") can use that picture as a reference: IP-Adapter plus-face on a crop of
# its face, so the face stays closer. An initial picture and a "new face" re-roll never use
# one. Bake-off run r4 (docs/research.md section 5); chosen by the user, 2026-11-11.
enabled = true                      # false: every picture is drawn without a reference
scale = 0.1                         # adapter strength; 0.1-0.2 kept kit accuracy in r4
other_clubs = false                 # true: also for re-draws of players outside my club

[my_club]
# Prompt adjustments for players at my club, applied when the prompt is built. The stored
# character sheet is unchanged. Chosen by the user, 2026-11-11 (docs/spec.md section 3).
banned_traits = ["freckles", "muscular"] # left out of the prompt and added to its negative
soften_skin = 2                     # tan and dark skin drawn this many steps lighter (0-2)
# Share of sharp-eyed players drawn with round eyes instead (0-1): the user prefers round eyes
# at my club, and sports portraits already lean sharp (2026-11-12). Seeded per player, so a
# player's pictures agree. At 0.2, round goes from 1 in 3 players to 2 in 5.
round_eyes = 0.2

[body]
# Height and build words (user, 2026-11-11): only the tallest and shortest tenth of men's
# players, and the strongest and weakest tenth by Strength, get a word. fmsave reads no
# weight, so Strength (1-20) stands in for build. Set from the Colchester save's 21,834
# men's players (height p10 173 cm, p90 191 cm; Strength p10 4, p90 14); the exact cut does
# not matter. The class is stored in each player's sheet when it is first sampled.
short_below_cm = 174                # under this: "petite" (12% of men's players)
tall_from_cm = 191                  # this or taller: "tall female" (10%)
slim_strength_at_most = 4           # Strength this or lower: "skinny"
muscular_strength_from = 14         # Strength this or higher: "muscular female" (10%); the
                                    # trait "muscular" is banned at my club by default

[personality]
# Personality weights the default expression of a newly sampled character sheet (docs/spec.md
# section 4); nothing else. A player's attribute in about the top or bottom tenth of men's
# players makes the expression it points to more likely, e.g. high Pressure confident, high
# Professionalism serious; the table is in src/kitshot/traits.py. Each such attribute
# multiplies its expression's weight by (1 + weight): at 2, one high Pressure takes
# "confident" from 1 in 4 to 1 in 2. 0 turns it off. Stored sheets are not re-sampled.
weight = 2

[schedule]
# `kitshot serve` looks at FM27's saves folder this often. When the newest save has changed
# and then stays unchanged for a few seconds, it is copied and synced (spec section 6).
poll_seconds = 60
# false: the GPU works only while FM27 is closed; "Generate now" in the UI overrides it.
generate_while_fm_running = false
# Groups whose automatic jobs `kitshot serve` draws. Manual requests from the UI always run,
# whatever their group. All three since Phase 4.
auto_groups = ["a", "b", "c"]

[render]
# Diffusers' VAE tiling and slicing: the picture is decoded from the model's latents in tiles
# and one at a time, which lowers the peak graphics memory on cards under 10 GB. A little slower,
# and the blended tiles can change a picture slightly. "Auto-configure for my GPU" on the
# Settings page turns it on for such a card. Applies from the next picture.
vae_tiling = false

[picture]
# The shape of pictures drawn from now on: "3:4" (portrait) or "1:1" (square), for everyone
# (Phase 16g). A change re-draws nobody: each picture keeps the shape it was drawn in. Square by
# default (user, 2026-11-22); a database that already held pictures keeps "3:4" as its own
# setting (persistence/db.py, migration 15).
aspect = "1:1"

[style]
# How pictures look, for everyone drawn: players, staff and media (user, 2026-11-20). The model
# draws: "realvis" (photos, RealVisXL V5.0 with INT8 weights), "zimage_turbo" (photos,
# Z-Image-Turbo with NF4 weights; it keeps no face from the current picture on a re-draw) or
# "animagine" (anime, Animagine XL 4.0). Only the chosen model's files are downloaded. A change
# applies to pictures drawn from then on; existing pictures stay as they are until they are drawn
# again for another reason, and a re-draw keeps the face only from a picture of the same model.
# RealVisXL and men by default since 0.1.8 (user, 2026-11-25); a database that already held
# pictures keeps Animagine and women as its own settings (persistence/db.py, migration 18).
model = "realvis"
# "woman" or "man": everyone is drawn as one or the other. The same applies on a change, and a
# re-draw keeps the face only from a picture of the same gender.
gender = "man"

[display]
# How the window looks (Phase 12). "auto" follows Windows: the display language the window
# reports, and Windows's light or dark app mode. The switches at the foot of the window's
# sidebar change these too, as one change you can undo.
language = "auto"                   # auto, en (English) or ko (한국어)
theme = "auto"                      # auto, light or dark

[notifications]
# The tray's "New pictures" notification once drawing stops (Windows app). false: not shown;
# the other notifications (errors, unsupported saves, syncs from the tray) stay.
new_pictures = true

[updates]
# Look for a newer Kitshot once a day (Phase 13): one request for this repository's list of
# releases on GitHub, which sends nothing about this PC or its user. A newer one is offered on
# the dashboard; nothing is downloaded until you choose Update. false: never look.
check = true

[ui]
# Local only: there is no login, so `kitshot serve` refuses any address but loopback. These
# keys can only be changed here, not from the UI.
host = "127.0.0.1"
port = 8765
