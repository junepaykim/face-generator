# Kit colours (docs/spec.md section 3), read by src/facegen/kits.py.
#
# Keyed by the game's unique club ID (the club names below are comments only). A club not
# listed here is drawn in the [fallback] kit. Goalkeepers wear the goalkeeper kit.
#
# Vocabulary (anything else is refused, so the table cannot add other words to a prompt):
#   colours   red, claret, white, black, blue, sky, navy, yellow, amber, orange, green,
#             purple, grey, pink
#   patterns  plain (one shirt colour); stripes (vertical), hoops (horizontal), sleeves
#             (body, then sleeves), two-tone (halves or quarters): two shirt colours
#   home        shirt = [..], pattern, shorts (required), trim (collar colour)
#   goalkeeper  shirt = [..], pattern, trim, gloves (default black)
#
# Logos, badges and sponsors are never asked for. Stripes and hoops are drawn as well as
# the model manages (decisions.md, 2026-11-10).
#
# DRAFT, 2026-11-11: League Two 2026/27 as loaded in the Colchester career, home colours from
# memory of each club's traditional kit. Goalkeeper colours are placeholders that contrast with
# the home kit (red home: green; blue home: yellow; black and white: orange); real
# goalkeeper kits change every season. Entries marked "check" are the least certain.

[fallback]
home = { shirt = ["white"], shorts = "black" }
goalkeeper = { shirt = ["green"] }

