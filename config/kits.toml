# Kit colours (docs/spec.md section 3), read by src/kitshot/datasource/kits.py.
#
# Keyed by the game's unique club ID (the club names below are comments only). This table
# always comes first. A club not listed here is drawn in its home shirt from FM27's own
# database, read on this PC from the game's install folder (src/kitshot/datasource/
# game_kits.py: the shirt's colours and pattern and the goalkeeper's shirt colour, no
# shorts); failing that, in the colours estimated from FM27's own image of its home shirt
# when there is one (the kit catalog bundled as src/kitshot/data/kit_catalog.json, or a newer
# data/kit-colour-probe/report.json written on this PC by scripts/spikes/kit_colour_probe.py:
# colours only, no pattern or shorts); else in the [fallback] kit. Goalkeepers wear the
# goalkeeper kit.
#
# Vocabulary (anything else is refused, so the table cannot add other words to a prompt):
#   colours   red, claret, white, black, blue, sky, navy, yellow, amber, orange, green,
#             purple, grey, pink
#   patterns  plain (one shirt colour); with the body's colour first, then the pattern's:
#             stripes (vertical; two or three colours), hoops (horizontal), sleeves, two-tone
#             (halves or quarters), mixed (two colours, layout not known), pinstripes,
#             thin-hoops, checks, centre-stripe (one wide stripe down the middle), sash
#             (diagonal; two or three colours), band (across the chest; two or three colours),
#             chevron (a V across the chest), cross
#   home        shirt = [..], pattern, shorts (required), trim (collar colour)
#   goalkeeper  shirt = [..], pattern, trim, gloves (default black)
#
# Logos, badges and sponsors are never asked for. Stripes and hoops are drawn as well as
# the model manages (decisions.md, 2026-11-10).

[fallback]
home = { shirt = ["white"], shorts = "black" }
goalkeeper = { shirt = ["green"] }

# --- Patterns checked by eye on FM27's own kit images (2026-11-12) ------------------------
# The kit catalog gives these clubs' colours but not their patterns, so they are written
# here. Shorts from each club's usual kit; goalkeepers are placeholders that contrast with
# the home kit. FM27's own database now gives the same patterns; these stay for their shorts.
# The League Two drafts from memory (2026-11-11) were removed on 2026-11-24 (user), so FM27's
# own kits apply to those clubs.

[clubs.602]                                   # Arsenal: red body, white sleeves
home = { shirt = ["red", "white"], pattern = "sleeves", shorts = "white" }
goalkeeper = { shirt = ["green"] }

[clubs.688]                                   # Newcastle United: black and white stripes
home = { shirt = ["black", "white"], pattern = "stripes", shorts = "black" }
goalkeeper = { shirt = ["orange"] }

[clubs.1569]                                  # Celtic: green and white hoops
home = { shirt = ["green", "white"], pattern = "hoops", shorts = "white" }
goalkeeper = { shirt = ["yellow"] }
