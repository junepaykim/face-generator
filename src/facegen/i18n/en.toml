# facegen's English UI text (Phase 12). Keys are used by the templates and the web routes;
# ko.toml holds the same keys in Korean. Values in braces are filled in; a table with "one"
# and "other" picks by the number in {count}. {a}, {b} and {c} name the picture groups (a
# coloured chip on a page). A text may hold simple HTML (a link, a code span): the catalog is
# trusted, the values filled in are escaped. Keep explanations short: what one or two uses
# make obvious needs none; the rest goes in an ⓘ tip (keys ending in "tip").

