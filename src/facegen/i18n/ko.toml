# facegen의 한국어 UI 문구 (Phase 12). en.toml과 같은 키를 씁니다. 중괄호 안의 이름은 값으로
# 채워지고, {a}, {b}, {c}는 그룹 이름(페이지에서는 색 칩)입니다. 한국어는 수에 따라 형태가
# 바뀌지 않으므로 one/other 없이 한 문장만 둡니다. 번역투를 피하고, 한두 번 써 보면 알 수 있는
# 기능에는 설명을 달지 않습니다. 꼭 필요한 설명은 ⓘ 팁(키 이름이 tip)으로 둡니다.
# 용어: 그림 = facegen이 만든 초상화, 사진 = FM27이나 페이스팩의 사진, 구단, 생성 선수(뉴젠),
# 연동(추적), 세이브, 동기화, 대기열.

