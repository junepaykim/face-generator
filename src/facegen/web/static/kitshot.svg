<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
  <defs>
    <linearGradient id="icon-bg" x1="128" y1="0" x2="128" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#253E60" />
      <stop offset="52%" stop-color="#1B304D" />
      <stop offset="100%" stop-color="#132238" />
    </linearGradient>
    <radialGradient id="icon-glow" cx="128" cy="48" r="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
    <clipPath id="icon-squircle">
      <rect x="0" y="0" width="256" height="256" rx="56" />
    </clipPath>
    <clipPath id="icon-frame-clip">
      <rect x="56" y="56" width="144" height="144" rx="18" />
    </clipPath>
    <clipPath id="icon-vf-torso-clip">
      <path d="M 58 204 C 61 166 79 149 105 146 L 128 176 L 151 146 C 177 149 195 166 198 204 Z" />
    </clipPath>
  </defs>
  <rect x="0" y="0" width="256" height="256" rx="56" fill="url(#icon-bg)" />
  <rect x="0" y="0" width="256" height="256" rx="56" fill="url(#icon-glow)" />
  <g clip-path="url(#icon-squircle)">
    <!-- Subtle Inner Portrait Plate -->
    <rect x="56" y="56" width="144" height="144" rx="18" fill="#0B1626" fill-opacity="0.46" />
    <!-- Framed Player Headshot Silhouette -->
    <g clip-path="url(#icon-frame-clip)">
      <ellipse cx="128" cy="105" rx="27" ry="30" fill="#F4F0E6" />
      <path d="M 58 204 C 61 166 79 149 105 146 L 128 176 L 151 146 C 177 149 195 166 198 204 Z" fill="#F4F0E6" />
      <g clip-path="url(#icon-vf-torso-clip)">
        <path d="M 101 141 L 128 176 L 155 141" fill="none" stroke="#38BDF8" stroke-width="16" stroke-linejoin="round" stroke-linecap="round" />
      </g>
    </g>
    <!-- Camera Viewfinder Corner Brackets (TL, BL, BR) -->
    <g stroke="#F4F0E6" stroke-opacity="0.52" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 36 80 L 36 52 A 16 16 0 0 1 52 36 L 80 36" />
      <path d="M 36 176 L 36 204 A 16 16 0 0 0 52 220 L 80 220" />
      <path d="M 176 220 L 204 220 A 16 16 0 0 0 220 204 L 220 176" />
    </g>
    <!-- Active Top-Right Accent Bracket & Focus Indicator Dot -->
    <path d="M 176 36 L 204 36 A 16 16 0 0 1 220 52 L 220 80" stroke="#38BDF8" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <circle cx="180" cy="76" r="8.5" fill="#38BDF8" />
  </g>
  <rect x="1.5" y="1.5" width="253" height="253" rx="54.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.11" stroke-width="3" />
</svg>
