[project]
name = "facegen"
version = "0.1.4"
description = "Generates anime-style portraits for Football Manager 27 players."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    # Alpha library that tracks game patches. Keep the exact pin; see AGENTS.md.
    "fmsave==0.12.6",
    # Pictures: publishing (downscale, PNG) and the quality check's head position.
    "jinja2>=3.1",
    "pillow>=10",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30",
]

[project.scripts]
facegen = "facegen.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "ruff>=0.6",
]
# Image generation and the tagger (Phase 0.3 onwards). Several gigabytes with CUDA;
# AGENTS.md rule 4. The pure modules and their tests never import these.
# `uv sync --no-group gpu` gives a light environment without them.
gpu = [
    "torch>=2.6",
    "diffusers>=0.35",
    "transformers>=4.50",
    "accelerate>=1.0",
    "safetensors>=0.4",
    "timm>=1.0",
]
# The optional Rust extension (native/, built with maturin; needs a Rust toolchain). It
# speeds up the figure scan and the published-picture encoder; every part of it has a
# Python fallback. `uv sync --no-group native` leaves it out. Not built on Windows, where
# few players have Rust and the MSVC build tools: `facegen native --install` installs the
# prebuilt wheel there (native_wheel.py), and `uv sync --inexact` keeps it.
native = ["facegen-native; sys_platform != 'win32'"]
# The desktop app (Phase 11, `facegen app` and `facegen tray`): the tray icon and the window
# (pywebview on Microsoft Edge WebView2). Windows only, so Linux and WSL installs do not
# change; there `facegen serve` and the browser remain the way in.
desktop = [
    "pystray>=0.19.5; sys_platform == 'win32'",
    "pywebview>=6.2; sys_platform == 'win32'",
]

[tool.uv]
default-groups = ["dev", "gpu", "native", "desktop"]

[tool.uv.workspace]
members = ["native"]

[tool.uv.sources]
facegen-native = { workspace = true, editable = false }
# PyPI's torch for Windows has no CUDA, so on Windows torch comes from PyTorch's own index,
# built for CUDA 13.2 like Linux's torch from PyPI. Elsewhere: PyPI. (torchvision, which timm
# needs, stays PyPI's: the tagger uses none of its CUDA parts.)
torch = [{ index = "pytorch-cu132", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/facegen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "--import-mode=importlib --strict-markers"
markers = [
    "unit: isolated logic with synthetic inputs, no database or child processes",
    "integration: temporary storage, adapters, process and application wiring",
    "parity: native/Python and CPU tensor equivalence contracts",
    "di: architecture, dependency injection and public compatibility contracts",
    "opt_in: hardware or platform checks outside the portable default suite",
    "gpu: requires FACEGEN_TEST_GPU=1 and already cached models on a CUDA GPU",
    "real_save: requires FACEGEN_TEST_SAVE pointing at a local snapshot copy",
    "windows_only: requires native Windows; skipped on Linux and WSL",
]

[tool.ruff]
line-length = 100
target-version = "py312"
