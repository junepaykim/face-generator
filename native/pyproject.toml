[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "kitshot-native"
version = "0.2.0"
description = "Rust versions of Kitshot's CPU-bound picture work (optional)."
requires-python = ">=3.12"

[tool.maturin]
module-name = "kitshot_native"
profile = "release"

[tool.uv]
# Rebuild when the Rust side changes, not only when this file does.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "src/**/*.rs" },
]
